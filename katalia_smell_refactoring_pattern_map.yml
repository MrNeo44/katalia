schema: v1
name: "KatalIA Smell → Refactoring → Pattern Map"
version: "2026.01d"

sources:
  refactoring_guru:
    base_url: "https://refactoring.guru/es/refactoring"
    note: "Catálogo de técnicas de refactorización (nombres y páginas por técnica)."
  academic_evidence:
    note: "Evidencia (prioridad JSS) que respalda: (i) smells↔refactoring, (ii) impacto/calidad, (iii) refactoring-to-patterns."

references:
  # --- JSS (core) ---
  - id: JSS2020_Lacerda_Tertiary
    venue: "Journal of Systems and Software"
    year: 2020
    title: "Code smells and refactoring: A tertiary systematic review of challenges and observations"
    doi: "10.1016/j.jss.2020.110610"

  - id: JSS2018_Sharma_SmellsSurvey
    venue: "Journal of Systems and Software"
    year: 2018
    title: "A survey on software smells"
    doi: "10.1016/j.jss.2017.12.034"

  - id: JSS2015_Bavota_QualityRefactoring
    venue: "Journal of Systems and Software"
    year: 2015
    title: "An experimental investigation on the innate relationship between quality and refactoring"
    doi: "10.1016/j.jss.2015.05.024"

  - id: JSS2017_Szoke_IndustrialRefactoring
    venue: "Journal of Systems and Software"
    year: 2017
    title: "Empirical study on refactoring large-scale industrial systems and its effects on maintainability"
    doi: "10.1016/j.jss.2016.08.071"

  - id: JSS2010_Tsantalis_Polymorphism
    venue: "Journal of Systems and Software"
    year: 2010
    title: "Identification of refactoring opportunities introducing polymorphism"
    doi: "10.1016/j.jss.2009.09.017"

  - id: JSS2011_Tsantalis_ExtractMethod
    venue: "Journal of Systems and Software"
    year: 2011
    title: "Identification of extract method refactoring opportunities for the decomposition of methods"
    doi: "10.1016/j.jss.2011.05.016"

  # --- Extra journal evidence (pattern-specific) ---
  - id: IST2012_Christopoulou_Strategy
    venue: "Information and Software Technology"
    year: 2012
    title: "Automated refactoring to the Strategy design pattern"
    doi: "10.1016/j.infsof.2012.05.004"

refactoring_techniques:
  # Composing Methods
  EXTRACT_METHOD: { name: "Extract Method", url: "https://refactoring.guru/es/refactoring/extract-method" }
  INLINE_METHOD: { name: "Inline Method", url: "https://refactoring.guru/es/refactoring/inline-method" }
  EXTRACT_VARIABLE: { name: "Extract Variable", url: "https://refactoring.guru/es/refactoring/extract-variable" }
  INLINE_TEMP: { name: "Inline Temp", url: "https://refactoring.guru/es/refactoring/inline-temp" }
  REPLACE_TEMP_WITH_QUERY: { name: "Replace Temp with Query", url: "https://refactoring.guru/es/refactoring/replace-temp-with-query" }
  SPLIT_TEMPORARY_VARIABLE: { name: "Split Temporary Variable", url: "https://refactoring.guru/es/refactoring/split-temporary-variable" }
  REMOVE_ASSIGNMENTS_TO_PARAMETERS: { name: "Remove Assignments to Parameters", url: "https://refactoring.guru/es/refactoring/remove-assignments-to-parameters" }
  REPLACE_METHOD_WITH_METHOD_OBJECT: { name: "Replace Method with Method Object", url: "https://refactoring.guru/es/refactoring/replace-method-with-method-object" }
  SUBSTITUTE_ALGORITHM: { name: "Substitute Algorithm", url: "https://refactoring.guru/es/refactoring/substitute-algorithm" }

  # Moving Features between Objects
  MOVE_METHOD: { name: "Move Method", url: "https://refactoring.guru/es/refactoring/move-method" }
  MOVE_FIELD: { name: "Move Field", url: "https://refactoring.guru/es/refactoring/move-field" }
  EXTRACT_CLASS: { name: "Extract Class", url: "https://refactoring.guru/es/refactoring/extract-class" }
  INLINE_CLASS: { name: "Inline Class", url: "https://refactoring.guru/es/refactoring/inline-class" }
  HIDE_DELEGATE: { name: "Hide Delegate", url: "https://refactoring.guru/es/refactoring/hide-delegate" }
  REMOVE_MIDDLE_MAN: { name: "Remove Middle Man", url: "https://refactoring.guru/es/refactoring/remove-middle-man" }

  # Organizing Data
  SELF_ENCAPSULATE_FIELD: { name: "Self Encapsulate Field", url: "https://refactoring.guru/es/refactoring/self-encapsulate-field" }
  REPLACE_DATA_VALUE_WITH_OBJECT: { name: "Replace Data Value with Object", url: "https://refactoring.guru/es/refactoring/replace-data-value-with-object" }
  REPLACE_MAGIC_NUMBER_WITH_SYMBOLIC_CONSTANT: { name: "Replace Magic Number with Symbolic Constant", url: "https://refactoring.guru/es/refactoring/replace-magic-number-with-symbolic-constant" }
  ENCAPSULATE_FIELD: { name: "Encapsulate Field", url: "https://refactoring.guru/es/refactoring/encapsulate-field" }
  ENCAPSULATE_COLLECTION: { name: "Encapsulate Collection", url: "https://refactoring.guru/es/refactoring/encapsulate-collection" }
  REPLACE_TYPE_CODE_WITH_CLASS: { name: "Replace Type Code with Class", url: "https://refactoring.guru/es/refactoring/replace-type-code-with-class" }
  REPLACE_TYPE_CODE_WITH_SUBCLASSES: { name: "Replace Type Code with Subclasses", url: "https://refactoring.guru/es/refactoring/replace-type-code-with-subclasses" }
  REPLACE_TYPE_CODE_WITH_STATE_STRATEGY: { name: "Replace Type Code with State/Strategy", url: "https://refactoring.guru/es/refactoring/replace-type-code-with-state-strategy" }

  # Simplifying Conditional Expressions
  DECOMPOSE_CONDITIONAL: { name: "Decompose Conditional", url: "https://refactoring.guru/es/refactoring/decompose-conditional" }
  CONSOLIDATE_CONDITIONAL_EXPRESSION: { name: "Consolidate Conditional Expression", url: "https://refactoring.guru/es/refactoring/consolidate-conditional-expression" }
  CONSOLIDATE_DUPLICATE_CONDITIONAL_FRAGMENTS: { name: "Consolidate Duplicate Conditional Fragments", url: "https://refactoring.guru/es/refactoring/consolidate-duplicate-conditional-fragments" }
  REMOVE_CONTROL_FLAG: { name: "Remove Control Flag", url: "https://refactoring.guru/es/refactoring/remove-control-flag" }
  REPLACE_NESTED_CONDITIONAL_WITH_GUARD_CLAUSES: { name: "Replace Nested Conditional with Guard Clauses", url: "https://refactoring.guru/es/refactoring/replace-nested-conditional-with-guard-clauses" }
  REPLACE_CONDITIONAL_WITH_POLYMORPHISM: { name: "Replace Conditional with Polymorphism", url: "https://refactoring.guru/es/refactoring/replace-conditional-with-polymorphism" }
  INTRODUCE_NULL_OBJECT: { name: "Introduce Null Object", url: "https://refactoring.guru/es/refactoring/introduce-null-object" }
  INTRODUCE_ASSERTION: { name: "Introduce Assertion", url: "https://refactoring.guru/es/refactoring/introduce-assertion" }

  # Simplifying Method Calls
  RENAME_METHOD: { name: "Rename Method", url: "https://refactoring.guru/es/refactoring/rename-method" }
  ADD_PARAMETER: { name: "Add Parameter", url: "https://refactoring.guru/es/refactoring/add-parameter" }
  REMOVE_PARAMETER: { name: "Remove Parameter", url: "https://refactoring.guru/es/refactoring/remove-parameter" }
  SEPARATE_QUERY_FROM_MODIFIER: { name: "Separate Query from Modifier", url: "https://refactoring.guru/es/refactoring/separate-query-from-modifier" }
  PARAMETERIZE_METHOD: { name: "Parameterize Method", url: "https://refactoring.guru/es/refactoring/parameterize-method" }
  REPLACE_PARAMETER_WITH_EXPLICIT_METHODS: { name: "Replace Parameter with Explicit Methods", url: "https://refactoring.guru/es/refactoring/replace-parameter-with-explicit-methods" }
  PRESERVE_WHOLE_OBJECT: { name: "Preserve Whole Object", url: "https://refactoring.guru/es/refactoring/preserve-whole-object" }
  REPLACE_PARAMETER_WITH_METHOD_CALL: { name: "Replace Parameter with Method Call", url: "https://refactoring.guru/es/refactoring/replace-parameter-with-method-call" }
  INTRODUCE_PARAMETER_OBJECT: { name: "Introduce Parameter Object", url: "https://refactoring.guru/es/refactoring/introduce-parameter-object" }
  HIDE_METHOD: { name: "Hide Method", url: "https://refactoring.guru/es/refactoring/hide-method" }
  REPLACE_CONSTRUCTOR_WITH_FACTORY_METHOD: { name: "Replace Constructor with Factory Method", url: "https://refactoring.guru/es/refactoring/replace-constructor-with-factory-method" }
  REPLACE_ERROR_CODE_WITH_EXCEPTION: { name: "Replace Error Code with Exception", url: "https://refactoring.guru/es/refactoring/replace-error-code-with-exception" }
  REPLACE_EXCEPTION_WITH_TEST: { name: "Replace Exception with Test", url: "https://refactoring.guru/es/refactoring/replace-exception-with-test" }

  # Dealing with Generalization
  PULL_UP_FIELD: { name: "Pull Up Field", url: "https://refactoring.guru/es/refactoring/pull-up-field" }
  PULL_UP_METHOD: { name: "Pull Up Method", url: "https://refactoring.guru/es/refactoring/pull-up-method" }
  PUSH_DOWN_METHOD: { name: "Push Down Method", url: "https://refactoring.guru/es/refactoring/push-down-method" }
  EXTRACT_SUBCLASS: { name: "Extract Subclass", url: "https://refactoring.guru/es/refactoring/extract-subclass" }
  EXTRACT_SUPERCLASS: { name: "Extract Superclass", url: "https://refactoring.guru/es/refactoring/extract-superclass" }
  EXTRACT_INTERFACE: { name: "Extract Interface", url: "https://refactoring.guru/es/refactoring/extract-interface" }
  COLLAPSE_HIERARCHY: { name: "Collapse Hierarchy", url: "https://refactoring.guru/es/refactoring/collapse-hierarchy" }
  FORM_TEMPLATE_METHOD: { name: "Form Template Method", url: "https://refactoring.guru/es/refactoring/form-template-method" }
  REPLACE_INHERITANCE_WITH_DELEGATION: { name: "Replace Inheritance with Delegation", url: "https://refactoring.guru/es/refactoring/replace-inheritance-with-delegation" }

maps:
  # ============================================================
  # A) Smells locales (código) → refactorings (sin patrón obligatorio)
  # ============================================================
  code_smells_local:
    DUPLICATE_CODE:
      kind: local
      intent: "Eliminar duplicación (menos inconsistencias, menos costo de cambio)."
      primary_refactorings: [EXTRACT_METHOD, FORM_TEMPLATE_METHOD, EXTRACT_CLASS, PULL_UP_METHOD]
      secondary_refactorings: [SUBSTITUTE_ALGORITHM]
      evidence_refs: [JSS2020_Lacerda_Tertiary, JSS2018_Sharma_SmellsSurvey]

    LONG_METHOD:
      kind: local
      intent: "Reducir tamaño/entropía del método, mejorar entendibilidad y testeabilidad."
      primary_refactorings: [EXTRACT_METHOD, REPLACE_METHOD_WITH_METHOD_OBJECT, SUBSTITUTE_ALGORITHM]
      secondary_refactorings: [REPLACE_TEMP_WITH_QUERY, EXTRACT_VARIABLE, SEPARATE_QUERY_FROM_MODIFIER]
      evidence_refs: [JSS2020_Lacerda_Tertiary, JSS2011_Tsantalis_ExtractMethod]

    COMPLEX_CONDITIONAL:
      kind: local
      intent: "Bajar complejidad de decisiones y anidación."
      primary_refactorings: [DECOMPOSE_CONDITIONAL, REPLACE_NESTED_CONDITIONAL_WITH_GUARD_CLAUSES, CONSOLIDATE_CONDITIONAL_EXPRESSION]
      secondary_refactorings: [REPLACE_CONDITIONAL_WITH_POLYMORPHISM, INTRODUCE_NULL_OBJECT, INTRODUCE_ASSERTION]
      evidence_refs: [JSS2020_Lacerda_Tertiary, JSS2010_Tsantalis_Polymorphism, IST2012_Christopoulou_Strategy]

    COMPLEX_METHOD:
      kind: local
      intent: "Bajar caminos de ejecución; aislar responsabilidades."
      primary_refactorings: [EXTRACT_METHOD, REPLACE_METHOD_WITH_METHOD_OBJECT, SUBSTITUTE_ALGORITHM]
      secondary_refactorings: [REMOVE_CONTROL_FLAG, REPLACE_NESTED_CONDITIONAL_WITH_GUARD_CLAUSES]
      evidence_refs: [JSS2020_Lacerda_Tertiary, JSS2011_Tsantalis_ExtractMethod]

    LONG_PARAMETER_LIST:
      kind: local
      intent: "Reducir acoplamiento y fragilidad de la API."
      primary_refactorings: [INTRODUCE_PARAMETER_OBJECT, PRESERVE_WHOLE_OBJECT, REPLACE_PARAMETER_WITH_METHOD_CALL]
      secondary_refactorings: [REMOVE_PARAMETER, PARAMETERIZE_METHOD, REPLACE_PARAMETER_WITH_EXPLICIT_METHODS]
      evidence_refs: [JSS2020_Lacerda_Tertiary, JSS2018_Sharma_SmellsSurvey]

    LONG_STATEMENT:
      kind: local
      intent: "Hacer explícita la intención; reducir densidad cognitiva por expresión gigante."
      primary_refactorings: [EXTRACT_VARIABLE, EXTRACT_METHOD, SPLIT_TEMPORARY_VARIABLE]
      secondary_refactorings: [INLINE_TEMP, SUBSTITUTE_ALGORITHM]
      evidence_refs: [JSS2018_Sharma_SmellsSurvey]

    MAGIC_NUMBER:
      kind: local
      intent: "Nombrar intención de constantes y evitar valores crípticos repetidos."
      primary_refactorings: [REPLACE_MAGIC_NUMBER_WITH_SYMBOLIC_CONSTANT]
      secondary_refactorings: [REPLACE_DATA_VALUE_WITH_OBJECT]
      evidence_refs: [JSS2018_Sharma_SmellsSurvey, JSS2020_Lacerda_Tertiary]

    MISSING_DEFAULT:
      kind: local
      intent: "Evitar casos no cubiertos en switch/match; mejorar robustez."
      primary_refactorings: [INTRODUCE_ASSERTION, INTRODUCE_NULL_OBJECT]
      secondary_refactorings: [REPLACE_CONDITIONAL_WITH_POLYMORPHISM, REPLACE_TYPE_CODE_WITH_STATE_STRATEGY]
      evidence_refs: [JSS2010_Tsantalis_Polymorphism, JSS2020_Lacerda_Tertiary]

    EMPTY_CATCH_CLAUSE:
      kind: local
      intent: "Evitar fallas silenciadas; hacer explícito el contrato de error."
      primary_refactorings: [REPLACE_EXCEPTION_WITH_TEST, REPLACE_ERROR_CODE_WITH_EXCEPTION]
      secondary_refactorings: [SEPARATE_QUERY_FROM_MODIFIER, EXTRACT_METHOD]
      note: "En práctica suele implicar logging/rethrow; aquí se modela con refactorings del catálogo Guru para formalizar el manejo."
      evidence_refs: [JSS2020_Lacerda_Tertiary]

    LONG_IDENTIFIER:
      kind: local
      intent: "Nombres demasiado largos suelen indicar conceptos mezclados o pobre modelado; primero aclara intención."
      primary_refactorings: [RENAME_METHOD, EXTRACT_METHOD, EXTRACT_CLASS]
      secondary_refactorings: [HIDE_METHOD]
      evidence_refs: [JSS2018_Sharma_SmellsSurvey]

    ABSTRACT_FUNCTION_CALL_FROM_CONSTRUCTOR:
      kind: local
      intent: "Evitar llamadas polimórficas desde ctor (estado incompleto → bugs sutiles)."
      primary_refactorings: [REPLACE_CONSTRUCTOR_WITH_FACTORY_METHOD, HIDE_METHOD]
      secondary_refactorings: [EXTRACT_METHOD, INTRODUCE_ASSERTION]
      evidence_refs: [JSS2020_Lacerda_Tertiary]

    LARGE_CLASS:
      kind: local
      intent: "Reducir responsabilidades por clase; mejorar cohesión."
      primary_refactorings: [EXTRACT_CLASS, MOVE_METHOD, EXTRACT_INTERFACE]
      secondary_refactorings: [EXTRACT_SUBCLASS, EXTRACT_SUPERCLASS]
      evidence_refs: [JSS2018_Sharma_SmellsSurvey, JSS2020_Lacerda_Tertiary]

    DEAD_CODE:
      kind: local
      intent: "Eliminar ruido y riesgo por ramas/símbolos sin uso."
      primary_refactorings: [INLINE_METHOD, REMOVE_PARAMETER]
      secondary_refactorings: [EXTRACT_METHOD]
      note: "La eliminación de dead code suele ser un paso mecánico; se apoya en simplificación/limpieza del catálogo."
      evidence_refs: [JSS2018_Sharma_SmellsSurvey]

  # ============================================================
  # B) Smells “sistémicos” (cambio/arquitectura) → patrones + recipes
  #    (estos sí suelen justificar llegar a un diseño objetivo)
  # ============================================================
  systemic_smells_to_patterns:
    SHOTGUN_SURGERY:
      scope: repo_or_component
      intent: "Un cambio lógico obliga a tocar muchos archivos/clases."
      pattern_candidates:
        - pattern: FACADE
          when: "Hay subsistema complejo y muchos clientes conocen detalles internos."
          recipe: [EXTRACT_CLASS, MOVE_METHOD, HIDE_DELEGATE, EXTRACT_INTERFACE]
          risk_note: "Evitar que la Facade se convierta en Blob."
        - pattern: MEDIATOR
          when: "Muchos objetos se coordinan many-to-many (interacciones explosivas)."
          recipe: [EXTRACT_CLASS, MOVE_METHOD, HIDE_DELEGATE, REMOVE_MIDDLE_MAN]
        - pattern: OBSERVER
          when: "Cambios deben notificar múltiples consumidores sin acoplarse."
          recipe: [EXTRACT_INTERFACE, MOVE_METHOD, INTRODUCE_PARAMETER_OBJECT]
      evidence_refs: [JSS2020_Lacerda_Tertiary, JSS2017_Szoke_IndustrialRefactoring]

    DIVERGENT_CHANGE:
      scope: class_or_component
      intent: "Entidad cambia por razones distintas (alta entropía de cambios)."
      pattern_candidates:
        - pattern: FACADE
          when: "El componente mezcla orquestación y reglas; necesitas frontera clara."
          recipe: [EXTRACT_CLASS, MOVE_METHOD, SEPARATE_QUERY_FROM_MODIFIER, EXTRACT_INTERFACE]
        - pattern: STRATEGY
          when: "Hay múltiples variantes de comportamiento que crecen en el tiempo."
          recipe: [EXTRACT_CLASS, REPLACE_CONDITIONAL_WITH_POLYMORPHISM, EXTRACT_INTERFACE]
        - pattern: COMMAND
          when: "Operaciones cambian independiente de los receptores; necesitas encapsular acciones."
          recipe: [EXTRACT_CLASS, MOVE_METHOD, INTRODUCE_PARAMETER_OBJECT]
      evidence_refs: [JSS2020_Lacerda_Tertiary, JSS2015_Bavota_QualityRefactoring]

  # ============================================================
  # C) Design smells → patrones (con recipes = técnicas Guru)
  # ============================================================
  design_smells_to_patterns:
    BLOB:
      intent: "Entidad que concentra lógica y orquesta todo (God Class)."
      pattern_candidates:
        - pattern: FACADE
          when: "Blob está actuando como puerta de entrada a un subsistema; separa API pública de lógica interna."
          recipe: [EXTRACT_CLASS, MOVE_METHOD, HIDE_DELEGATE, EXTRACT_INTERFACE]
          avoid_if: "Si la Facade terminará acumulando más lógica (riesgo de ‘Blob 2.0’)."
        - pattern: MEDIATOR
          when: "El problema real es coordinación many-to-many; mueve coordinación a un mediador, dejando roles limpios."
          recipe: [EXTRACT_CLASS, MOVE_METHOD, EXTRACT_INTERFACE]
        - pattern: STRATEGY
          when: "El Blob contiene múltiples algoritmos/variantes; extrae estrategias."
          recipe: [EXTRACT_CLASS, EXTRACT_INTERFACE, REPLACE_CONDITIONAL_WITH_POLYMORPHISM]
      evidence_refs: [JSS2018_Sharma_SmellsSurvey, JSS2015_Bavota_QualityRefactoring]

    SPAGHETTI_CODE:
      intent: "Control-flow enredado; evolución dolorosa."
      pattern_candidates:
        - pattern: STRATEGY
          when: "Condicionales eligen algoritmos/variantes."
          recipe: [DECOMPOSE_CONDITIONAL, REPLACE_CONDITIONAL_WITH_POLYMORPHISM, EXTRACT_CLASS, EXTRACT_INTERFACE]
        - pattern: STATE
          when: "Condicionales dependen de estado y cambian comportamiento según estado."
          recipe: [REPLACE_TYPE_CODE_WITH_STATE_STRATEGY, EXTRACT_CLASS, EXTRACT_INTERFACE]
        - pattern: CHAIN_OF_RESPONSIBILITY
          when: "Hay pipeline de decisiones/reglas aplicables secuencialmente."
          recipe: [EXTRACT_METHOD, EXTRACT_CLASS, MOVE_METHOD]
      evidence_refs: [JSS2010_Tsantalis_Polymorphism, IST2012_Christopoulou_Strategy]

    FUNCTIONAL_DECOMPOSITION:
      intent: "OO anémico: objetos con datos y funciones sueltas."
      pattern_candidates:
        - pattern: STRATEGY
          when: "Funciones sueltas son variantes intercambiables; llévalas a objetos con contrato."
          recipe: [EXTRACT_CLASS, EXTRACT_INTERFACE, MOVE_METHOD]
        - pattern: COMMAND
          when: "Funciones son operaciones que se quieren componer/registrar/ejecutar."
          recipe: [EXTRACT_CLASS, MOVE_METHOD, INTRODUCE_PARAMETER_OBJECT]
        - pattern: TEMPLATE_METHOD
          when: "Mismo esqueleto, pasos variables; evita duplicación de flujo."
          recipe: [PULL_UP_METHOD, FORM_TEMPLATE_METHOD, EXTRACT_SUBCLASS]
      evidence_refs: [JSS2018_Sharma_SmellsSurvey, JSS2020_Lacerda_Tertiary]

    SWISS_ARMY_KNIFE:
      intent: "Interfaz/abstracción que quiere servir a demasiados clientes."
      pattern_candidates:
        - pattern: ADAPTER
          when: "Necesitas vistas por cliente sin reventar el contrato gigante."
          recipe: [EXTRACT_INTERFACE, EXTRACT_CLASS, HIDE_METHOD]
        - pattern: FACADE
          when: "Quieres API simple para la mayoría y dejar el resto detrás."
          recipe: [EXTRACT_INTERFACE, HIDE_DELEGATE, EXTRACT_CLASS]
        - pattern: PROXY
          when: "Hay control de acceso/caching/log/retry y no quieres ensuciar la interfaz base."
          recipe: [EXTRACT_INTERFACE, EXTRACT_CLASS, HIDE_DELEGATE]
      evidence_refs: [JSS2018_Sharma_SmellsSurvey]

    UNNECESSARY_ABSTRACTION:
      intent: "Abstracción sin beneficio real."
      pattern_candidates: []
      recommended_refactorings: [COLLAPSE_HIERARCHY, INLINE_CLASS, REMOVE_MIDDLE_MAN]
      evidence_refs: [JSS2020_Lacerda_Tertiary]

    IMPERATIVE_ABSTRACTION:
      intent: "Abstracción con lógica que debería vivir en concretos."
      pattern_candidates:
        - pattern: TEMPLATE_METHOD
          when: "La abstracción debe definir solo esqueleto; concretos implementan pasos."
          recipe: [FORM_TEMPLATE_METHOD, PUSH_DOWN_METHOD, EXTRACT_SUBCLASS]
        - pattern: STRATEGY
          when: "La variación es mejor por composición que por herencia."
          recipe: [REPLACE_INHERITANCE_WITH_DELEGATION, EXTRACT_INTERFACE, EXTRACT_CLASS]
      evidence_refs: [JSS2020_Lacerda_Tertiary, JSS2018_Sharma_SmellsSurvey]

    MULTIFACETED_ABSTRACTION:
      intent: "Abstracción con varias responsabilidades."
      pattern_candidates:
        - pattern: BRIDGE
          when: "Hay 2 dimensiones reales de variación (abstracción vs implementación) y se están mezclando."
          recipe: [EXTRACT_INTERFACE, EXTRACT_CLASS, MOVE_METHOD]
        - pattern: STRATEGY
          when: "Una de las facetas es algoritmo/variación."
          recipe: [EXTRACT_CLASS, EXTRACT_INTERFACE, REPLACE_CONDITIONAL_WITH_POLYMORPHISM]
      evidence_refs: [JSS2018_Sharma_SmellsSurvey]

    UNUTILIZED_ABSTRACTION:
      intent: "Abstracción casi no usada."
      pattern_candidates: []
      recommended_refactorings: [COLLAPSE_HIERARCHY, INLINE_CLASS, HIDE_METHOD]
      evidence_refs: [JSS2020_Lacerda_Tertiary]

    DUPLICATE_ABSTRACTION:
      intent: "Abstracciones paralelas que modelan lo mismo."
      pattern_candidates:
        - pattern: ADAPTER
          when: "No puedes unificar aún; necesitas compatibilidad sin reescritura total."
          recipe: [EXTRACT_INTERFACE, EXTRACT_CLASS, HIDE_DELEGATE]
        - pattern: FACADE
          when: "Quieres una API común sobre dos subsistemas duplicados."
          recipe: [EXTRACT_CLASS, HIDE_DELEGATE, EXTRACT_INTERFACE]
      evidence_refs: [JSS2020_Lacerda_Tertiary]

    DEFICIENT_ENCAPSULATION:
      intent: "Exposición excesiva de estado/detalles internos."
      pattern_candidates:
        - pattern: PROXY
          when: "Necesitas controlar acceso sin tocar al ‘real subject’ (auth/cache/log)."
          recipe: [EXTRACT_INTERFACE, EXTRACT_CLASS, HIDE_DELEGATE]
      recommended_refactorings: [ENCAPSULATE_FIELD, SELF_ENCAPSULATE_FIELD, ENCAPSULATE_COLLECTION]
      evidence_refs: [JSS2018_Sharma_SmellsSurvey]

    UNEXPLOITED_ENCAPSULATION:
      intent: "Encapsulación disponible pero no usada."
      pattern_candidates: []
      recommended_refactorings: [SELF_ENCAPSULATE_FIELD, ENCAPSULATE_FIELD, HIDE_METHOD]
      evidence_refs: [JSS2018_Sharma_SmellsSurvey]

    WIDE_HIERARCHY:
      intent: "Jerarquía demasiado ancha."
      pattern_candidates:
        - pattern: STRATEGY
          when: "Subclases representan variantes de comportamiento → composición escala mejor."
          recipe: [REPLACE_INHERITANCE_WITH_DELEGATION, EXTRACT_INTERFACE, EXTRACT_CLASS]
        - pattern: DECORATOR
          when: "La jerarquía existe para combinar responsabilidades opcionales."
          recipe: [EXTRACT_INTERFACE, EXTRACT_CLASS, HIDE_DELEGATE]
      evidence_refs: [JSS2018_Sharma_SmellsSurvey]

    DEEP_HIERARCHY:
      intent: "Jerarquía demasiado profunda."
      pattern_candidates:
        - pattern: STRATEGY
          when: "Herencia se usa para variación; migra a composición."
          recipe: [REPLACE_INHERITANCE_WITH_DELEGATION, COLLAPSE_HIERARCHY, EXTRACT_INTERFACE]
        - pattern: BRIDGE
          when: "Profundidad viene por mezclar abstracción/implementación."
          recipe: [EXTRACT_INTERFACE, EXTRACT_CLASS, MOVE_METHOD]
      evidence_refs: [JSS2018_Sharma_SmellsSurvey]

    MULTIPATH_HIERARCHY:
      intent: "Múltiples caminos de herencia hacia un ancestro."
      pattern_candidates:
        - pattern: BRIDGE
          when: "Necesitas separar dimensiones; evita combinatoria de herencia."
          recipe: [EXTRACT_INTERFACE, EXTRACT_CLASS, MOVE_METHOD]
      recommended_refactorings: [REPLACE_INHERITANCE_WITH_DELEGATION, COLLAPSE_HIERARCHY]
      evidence_refs: [JSS2018_Sharma_SmellsSurvey]

    CYCLIC_HIERARCHY:
      intent: "Ciclo en herencia."
      pattern_candidates: []
      recommended_refactorings: [REPLACE_INHERITANCE_WITH_DELEGATION, COLLAPSE_HIERARCHY, EXTRACT_INTERFACE]
      evidence_refs: [JSS2018_Sharma_SmellsSurvey]

    UNFACTORED_HIERARCHY:
      intent: "Jerarquía con duplicación/mala distribución."
      pattern_candidates:
        - pattern: TEMPLATE_METHOD
          when: "Hay algoritmo común en supertipo con pasos variables en subtipos."
          recipe: [PULL_UP_METHOD, FORM_TEMPLATE_METHOD, PUSH_DOWN_METHOD]
        - pattern: FACTORY_METHOD
          when: "La creación de subtipos está regada; centraliza puntos de extensión."
          recipe: [REPLACE_CONSTRUCTOR_WITH_FACTORY_METHOD, EXTRACT_METHOD]
      evidence_refs: [JSS2020_Lacerda_Tertiary]

    REBELLIOUS_HIERARCHY:
      intent: "Subtipos no respetan contrato del supertipo (LSP sufre)."
      pattern_candidates:
        - pattern: STRATEGY
          when: "En vez de ‘is-a’ forzado, usa composición para variaciones."
          recipe: [REPLACE_INHERITANCE_WITH_DELEGATION, EXTRACT_INTERFACE, EXTRACT_CLASS, MOVE_METHOD]
      recommended_refactorings: [EXTRACT_INTERFACE, COLLAPSE_HIERARCHY]
      evidence_refs: [JSS2018_Sharma_SmellsSurvey]

    MISSING_HIERARCHY:
      intent: "Falta jerarquía donde hay variantes/duplicación."
      pattern_candidates:
        - pattern: STRATEGY
          when: "Variantes de algoritmo seleccionadas por condiciones."
          recipe: [REPLACE_CONDITIONAL_WITH_POLYMORPHISM, EXTRACT_INTERFACE, EXTRACT_CLASS]
        - pattern: STATE
          when: "Variantes por estado."
          recipe: [REPLACE_TYPE_CODE_WITH_STATE_STRATEGY, EXTRACT_CLASS, EXTRACT_INTERFACE]
        - pattern: FACTORY_METHOD
          when: "Necesitas encapsular selección/creación del subtipo."
          recipe: [REPLACE_CONSTRUCTOR_WITH_FACTORY_METHOD, PARAMETERIZE_METHOD]
      evidence_refs: [JSS2010_Tsantalis_Polymorphism, IST2012_Christopoulou_Strategy]

    BROKEN_HIERARCHY:
      intent: "Jerarquía rota semánticamente."
      pattern_candidates:
        - pattern: STRATEGY
          when: "El ‘is-a’ es falso; cambia a composición."
          recipe: [REPLACE_INHERITANCE_WITH_DELEGATION, EXTRACT_INTERFACE, EXTRACT_CLASS]
      recommended_refactorings: [COLLAPSE_HIERARCHY, EXTRACT_INTERFACE, MOVE_METHOD]
      evidence_refs: [JSS2018_Sharma_SmellsSurvey]

guardrails:
  principles:
    - "Preferir refactorings locales (1–3 pasos) antes de introducir patrones."
    - "Introducir patrones solo si el smell es sistémico/recurrente (variación, acoplamiento, cascada de cambios)."
    - "Después de cada recipe: recalcular métricas y re-evaluar smells."
  evidence_refs: [JSS2017_Szoke_IndustrialRefactoring, JSS2015_Bavota_QualityRefactoring, JSS2020_Lacerda_Tertiary]
