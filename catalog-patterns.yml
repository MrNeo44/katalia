schema: v1
name: "KatalIA Pattern Catalog (GoF - Tradeoffs Only)"
version: "2026.01-gof-tradeoffs"

patterns:
  # -------------------------
  # Creational (5)
  # -------------------------
  - id: FACTORY_METHOD
    group: creational
    intent: "Delegar la creación a subclases/implementaciones para desacoplar 'new' del uso."
    tradeoffs:
      benefits:
        - "Reduce acoplamiento a clases concretas; facilita extender productos."
        - "Centraliza reglas de creación sin ensuciar el código cliente."
      costs:
        - "Más clases/indirección; puede sentirse como burocracia si el dominio es simple."
      risks:
        - "Explosión de fábricas si se usa para cada cosa sin criterio."

  - id: ABSTRACT_FACTORY
    group: creational
    intent: "Crear familias de objetos relacionados sin especificar clases concretas."
    tradeoffs:
      benefits:
        - "Consistencia entre productos de una misma familia."
        - "Cambiar familia completa suele ser más fácil (un punto de switch)."
      costs:
        - "Aumenta complejidad inicial; muchas interfaces."
      risks:
        - "Añadir un nuevo tipo de producto (no una familia) puede doler: toca varias fábricas."

  - id: BUILDER
    group: creational
    intent: "Construir objetos complejos paso a paso separando construcción de representación."
    tradeoffs:
      benefits:
        - "Control fino de construcción; evita constructores gigantes."
        - "Mejor legibilidad para objetos con muchas opciones."
      costs:
        - "Más código ceremonial (builder, director opcional)."
      risks:
        - "Overkill si el objeto no es realmente complejo o no tiene variantes."

  - id: PROTOTYPE
    group: creational
    intent: "Crear objetos clonando un prototipo en vez de instanciarlos desde cero."
    tradeoffs:
      benefits:
        - "Útil cuando crear es caro o depende de configuración dinámica."
        - "Evita jerarquías de fábricas para combinaciones múltiples."
      costs:
        - "Clonado correcto puede ser difícil (deep vs shallow)."
      risks:
        - "Clones que comparten estado accidentalmente (bugs sutiles)."

  - id: SINGLETON
    group: creational
    intent: "Asegurar una sola instancia global y un punto de acceso."
    tradeoffs:
      benefits:
        - "Acceso simple a un recurso compartido."
      costs:
        - "Introduce estado global: complica pruebas y razonamiento."
      risks:
        - "Se convierte en 'Dios oculto' del sistema; difícil de refactorizar después."

  # -------------------------
  # Structural (7)
  # -------------------------
  - id: ADAPTER
    group: structural
    intent: "Hacer compatibles interfaces que no encajan (wrapper traductor)."
    tradeoffs:
      benefits:
        - "Integra legacy/terceros sin reescribirlos."
        - "Aísla cambios externos del dominio."
      costs:
        - "Capa extra; puede proliferar en integraciones grandes."
      risks:
        - "Adaptadores encadenados: termina siendo un 'teléfono descompuesto'."

  - id: BRIDGE
    group: structural
    intent: "Separar abstracción de implementación para que evolucionen independiente."
    tradeoffs:
      benefits:
        - "Evita explosión de subclases (combinaciones de variantes)."
        - "Permite cambiar implementación sin tocar la abstracción."
      costs:
        - "Más composición/indirección; curva de lectura."
      risks:
        - "Si no hay dos dimensiones reales de variación, queda artificial."

  - id: COMPOSITE
    group: structural
    intent: "Tratar objetos individuales y composiciones de forma uniforme (árbol)."
    tradeoffs:
      benefits:
        - "Modela jerarquías naturalmente; simplifica cliente."
        - "Operaciones recursivas se vuelven directas."
      costs:
        - "Difícil restringir qué nodos pueden tener hijos."
      risks:
        - "Árbol demasiado flexible: reglas de negocio quedan difusas."

  - id: DECORATOR
    group: structural
    intent: "Agregar responsabilidades dinámicamente envolviendo objetos."
    tradeoffs:
      benefits:
        - "Evita subclases por combinaciones; composición flexible."
        - "Permite features 'plug-in'."
      costs:
        - "Muchas capas; depurar se pone entretenido (en el mal sentido)."
      risks:
        - "Orden de decoradores importa; comportamiento emergente difícil de prever."

  - id: FACADE
    group: structural
    intent: "Proveer una interfaz simple a un subsistema complejo."
    tradeoffs:
      benefits:
        - "Reduce fricción de uso; baja acoplamiento del cliente al subsistema."
        - "Buena frontera para modularizar."
      costs:
        - "Otra capa a mantener; puede duplicar funcionalidades."
      risks:
        - "Se vuelve un 'mega wrapper' que oculta demasiado y frena casos avanzados."

  - id: FLYWEIGHT
    group: structural
    intent: "Compartir estado intrínseco para ahorrar memoria con muchos objetos similares."
    tradeoffs:
      benefits:
        - "Ahorro fuerte en memoria/costos cuando hay enormes cantidades."
      costs:
        - "Complejidad: separar estado intrínseco vs extrínseco."
      risks:
        - "Si el supuesto de repetición no se cumple, solo agregaste complejidad."

  - id: PROXY
    group: structural
    intent: "Controlar acceso a un objeto (lazy, remoto, cache, protección)."
    tradeoffs:
      benefits:
        - "Lazy-loading, caching, control de acceso sin cambiar cliente."
      costs:
        - "Indirección extra; puede ocultar latencia/errores."
      risks:
        - "Proxy que se transforma en 'mini sistema' con lógica difícil de testear."

  # -------------------------
  # Behavioral (11)
  # -------------------------
  - id: CHAIN_OF_RESPONSIBILITY
    group: behavioral
    intent: "Pasar una solicitud por una cadena de handlers hasta que alguien la procese."
    tradeoffs:
      benefits:
        - "Desacopla emisor de receptor; composición flexible."
      costs:
        - "Flujo menos explícito; debugging requiere seguir la cadena."
      risks:
        - "Solicitud puede quedar sin manejar si no hay fallback claro."

  - id: COMMAND
    group: behavioral
    intent: "Encapsular una acción como objeto (cola, undo, logs, scheduling)."
    tradeoffs:
      benefits:
        - "Soporta undo/redo, auditoría, colas y ejecución diferida."
      costs:
        - "Muchos objetos comando; más boilerplate."
      risks:
        - "Diseño se infla si solo necesitabas llamar una función."

  - id: INTERPRETER
    group: behavioral
    intent: "Definir gramática y evaluar expresiones (DSL simple)."
    tradeoffs:
      benefits:
        - "Rápido para lenguajes pequeños; extensible por reglas."
      costs:
        - "Escala mal para gramáticas grandes; rendimiento y complejidad."
      risks:
        - "Termina siendo un parser casero frágil si el DSL crece."

  - id: ITERATOR
    group: behavioral
    intent: "Recorrer colecciones sin exponer su representación interna."
    tradeoffs:
      benefits:
        - "Uniforma traversal; permite múltiples recorridos."
      costs:
        - "Más tipos/abstracciones si el lenguaje ya lo trae resuelto."
      risks:
        - "Iteradores custom mal hechos rompen consistencia o concurrencia."

  - id: MEDIATOR
    group: behavioral
    intent: "Centralizar comunicación entre objetos para reducir acoplamiento directo."
    tradeoffs:
      benefits:
        - "Disminuye dependencia cruzada; coordina interacciones complejas."
      costs:
        - "El mediador puede crecer y volverse un 'mini dios'."
      risks:
        - "Se convierte en punto único de falla y cuello de botella conceptual."

  - id: MEMENTO
    group: behavioral
    intent: "Capturar y restaurar estado sin violar encapsulación (snapshots)."
    tradeoffs:
      benefits:
        - "Undo/restore sin exponer internals al exterior."
      costs:
        - "Memoria/almacenamiento de snapshots; serialización compleja."
      risks:
        - "Snapshots inconsistentes si el objeto tiene recursos externos."

  - id: OBSERVER
    group: behavioral
    intent: "Notificar automáticamente a suscriptores ante cambios (pub-sub)."
    tradeoffs:
      benefits:
        - "Desacopla productor/consumidor; reactividad limpia."
      costs:
        - "Orden de notificación y cascadas pueden complicar."
      risks:
        - "Fugas por suscripciones no removidas; efectos secundarios ocultos."

  - id: STATE
    group: behavioral
    intent: "Cambiar comportamiento según estado interno usando objetos estado."
    tradeoffs:
      benefits:
        - "Evita condicionales gigantes; estados explícitos y extensibles."
      costs:
        - "Aumenta número de clases; requiere disciplina."
      risks:
        - "Estados mal definidos generan transiciones confusas o duplicadas."

  - id: STRATEGY
    group: behavioral
    intent: "Encapsular algoritmos intercambiables; elegir en runtime."
    tradeoffs:
      benefits:
        - "Reduce condicionales; facilita test A/B de algoritmos."
        - "Extensión por composición (sin tocar cliente)."
      costs:
        - "Más objetos y indirección; hay que gestionar wiring."
      risks:
        - "Si solo hay 1-2 variantes estables, puede ser puro cosplay arquitectónico."

  - id: TEMPLATE_METHOD
    group: behavioral
    intent: "Definir esqueleto de un algoritmo y delegar pasos variables a subclases."
    tradeoffs:
      benefits:
        - "Reuso estructurado; evita duplicación de flujo."
      costs:
        - "Acopla al modelo de herencia; menos flexible que composición."
      risks:
        - "Jerarquías rígidas; cambios en el template impactan a muchos."

  - id: VISITOR
    group: behavioral
    intent: "Separar operaciones de una estructura de objetos (doble despacho)."
    tradeoffs:
      benefits:
        - "Agregar nuevas operaciones sin tocar las clases visitadas."
        - "Agrupa lógica relacionada en visitantes."
      costs:
        - "Agregar nuevos tipos de elementos es costoso (toca todos los visitors)."
      risks:
        - "Complejidad mental alta; fácil abusar y volverlo críptico."

  # -------------------------
  # Notes (opcional para KatalIA)
  # -------------------------
notes:
  - "Trade-offs = guías, no leyes físicas: patrones no son universalmente buenos o malos."
  - "Si aplicas varios patrones juntos, los costos pueden acumularse (acoplamiento entre patrones)."
